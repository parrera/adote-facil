services:
  adote-facil-postgres:
    image: postgres:14-alpine
    container_name: 'adote-facil-postgres'
    env_file:
      - ./backend/.env
    # Melhora: Centralização de variáveis sensíveis no env_file para evitar exposição no arquivo principal
    ports:
      - "${POSTGRES_CONTAINER_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-network # Isolamento: Apenas o backend consegue "enxergar" o banco de dados
    restart: unless-stopped # Resiliência: Reinicia o container automaticamente em caso de falha do serviço
    healthcheck:
      # Melhora: Validação real de prontidão. O banco só é considerado saudável quando aceita conexões
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Melhora: Controle de custos e performance, impedindo que o DB consuma toda a CPU/RAM do host
          cpus: '0.5'
          memory: 256M

  adote-facil-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Melhora: Segmentação via Multi-stage build para gerar uma imagem final mais leve e segura
      target: runner 
    container_name: 'adote-facil-backend'
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    depends_on:
      adote-facil-postgres:
        # Melhora: O backend aguarda o sucesso do healthcheck do DB, evitando erros de conexão na subida
        condition: service_healthy
    restart: always 
    networks:
      - backend-network
      - frontend-network # Ponte: O backend é o único serviço que transita entre as duas redes

  adote-facil-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 'adote-facil-frontend'
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - adote-facil-backend
    restart: unless-stopped
    networks:
      - frontend-network # Segurança: O frontend não tem rota física para o banco de dados

volumes:
  db_data: # Persistência: Garante que os dados do banco não sejam perdidos ao reiniciar os containers

networks:
  # Melhora: Arquitetura de rede em camadas (Tiered Networking) para maior segurança e isolamento
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge