services:
  adote-facil-postgres:
    image: postgres:14-alpine
    container_name: 'adote-facil-postgres'
    # ✅ CORREÇÃO: Apenas o 'env_file' é necessário.
    # Ele já carrega todas as variáveis do arquivo .env para dentro do contêiner.
    env_file:
      - ./backend/.env
    # ❌ ERRO: A seção 'environment' abaixo era redundante e foi removida.
    ports:
      - '6500:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - adote-facil-network
    healthcheck:
      # O healthcheck funciona melhor assim, pois usa as variáveis já carregadas pelo env_file
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  adote-facil-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 'adote-facil-backend'
    # ✅ CORREÇÃO: Adicionamos o 'env_file' aqui.
    # Agora o backend receberá a DATABASE_URL e saberá como se conectar ao banco.
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    depends_on:
      adote-facil-postgres:
        condition: service_healthy
    networks:
      - adote-facil-network

  adote-facil-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 'adote-facil-frontend'
    ports:
      - "3000:3000"
    depends_on:
      - adote-facil-backend
    networks:
      - adote-facil-network

volumes:
  db_data:

networks:
  adote-facil-network:
    driver: bridge